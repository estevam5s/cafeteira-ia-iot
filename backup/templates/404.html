<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - CoffeeAI Control</title>
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0a1f, #05051a);
            color: #ffffff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            padding: 2rem;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            color: #00ff88;
        }

        p {
            font-size: 1.5rem;
            margin: 1rem 0;
        }

        a {
            display: inline-block;
            padding: 1rem 2rem;
            background: #00ff88;
            color: #0a0a1f;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 2rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Página não encontrada</p>
        <a href="/">Voltar ao Início</a>
    </div>
</body>
</html>
