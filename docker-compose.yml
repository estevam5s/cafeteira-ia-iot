services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1884:1884"  # Mapeia 1884 externa para 1884 interna
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - coffeeai-network
    restart: unless-stopped

  coffeeai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffeeai
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DIFY_API_KEY=app-TgulottYoZSmZkVGtfTjR9EK
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1884  # Usa a mesma porta interna do mosquitto
      - HOST=0.0.0.0
    volumes:
      - .:/app
    depends_on:
      - mosquitto
    networks:
      - coffeeai-network
    restart: unless-stopped

networks:
  coffeeai-network:
    driver: bridge