<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeAI Control - Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-neon: #00ff88;
            --primary-glow: #00cc6a;
            --accent-pink: #ff3366;
            --accent-blue: #0088ff;
            --bg-dark: #0a0a1f;
            --bg-darker: #05051a;
            --text-light: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Rajdhani", sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-darker));
            color: var(--text-light);
            min-height: 100vh;
        }

        .container {
            display: grid;
            grid-template-areas:
                "header header"
                "nav nav"
                "sidebar main";
            grid-template-columns: 300px 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--glass-bg);
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }

        .header h1 {
            font-family: "Orbitron", sans-serif;
            font-size: 2rem;
            background: linear-gradient(45deg, var(--primary-neon), var(--accent-blue));
            /* -webkit-background-clip: text; */
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-info button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            background: var(--accent-pink);
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .user-info button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.3);
        }

        /* Navigation */
        .nav-container {
            grid-area: nav;
            background: var(--glass-bg);
            padding: 1rem;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }

        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 1rem;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.2rem;
            color: var(--text-light);
            text-decoration: none;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-item a:hover {
            background: var(--primary-neon);
            color: var(--bg-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        /* Sidebar */
        .sidebar {
            grid-area: sidebar;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .control-panel {
            background: var(--glass-bg);
            padding: 1.5rem;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }

        .control-panel h2 {
            font-family: "Orbitron", sans-serif;
            color: var(--primary-neon);
            margin-bottom: 1rem;
        }

        .control-button {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border: none;
            border-radius: 10px;
            font-family: "Orbitron", sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .power-on {
            background: var(--primary-neon);
            color: var(--bg-dark);
        }

        .power-off {
            background: var(--accent-pink);
            color: var(--text-light);
        }

        .control-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Status Panel */
        .status-panel {
            background: var(--glass-bg);
            padding: 1.5rem;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }

        .status-item {
            padding: 1rem;
            margin-bottom: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .status-online {
            background: var(--primary-neon);
            box-shadow: 0 0 10px var(--primary-neon);
        }

        .status-offline {
            background: var(--accent-pink);
            box-shadow: 0 0 10px var(--accent-pink);
        }

        .temperature-gauge {
            margin-top: 0.5rem;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .temperature-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-neon), var(--accent-pink));
            transition: width 0.5s ease;
        }

        /* Main Content */
        .main-content {
            grid-area: main;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .chat-container {
            background: var(--glass-bg);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            height: 100%;
            min-height: 60vh;
        }

        .messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        .message {
            padding: 1rem;
            border-radius: 10px;
            max-width: 80%;
            animation: slideIn 0.3s ease;
        }

        .user-message {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.2);
            align-self: flex-end;
            margin-left: 20%;
        }

        .bot-message {
            background: rgba(0, 136, 255, 0.1);
            border: 1px solid rgba(0, 136, 255, 0.2);
            align-self: flex-start;
            margin-right: 20%;
        }

        .input-container {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
        }

        .chat-input {
            flex-grow: 1;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 10px;
            color: var(--text-light);
            font-size: 1rem;
        }

        .chat-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 2px var(--primary-neon);
        }

        .send-button {
            padding: 1rem 2rem;
            border: none;
            border-radius: 10px;
            background: var(--primary-neon);
            color: var(--bg-dark);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-button:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        .send-button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsiveness */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "nav"
                    "sidebar"
                    "main";
            }

            .nav-menu {
                flex-direction: column;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>CoffeeAI Control</h1>
            <div class="user-info">
                <span>Bem-vindo, {{ user.name }}</span>
                <button onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </header>

        <nav class="nav-container">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" onclick="showGuide()">
                        <i class="fas fa-book"></i> Guia de Uso
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" onclick="showRecipes()">
                        <i class="fas fa-coffee"></i> Receitas
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" onclick="showMaintenance()">
                        <i class="fas fa-tools"></i> Manutenção
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" onclick="showStatus()">
                        <i class="fas fa-chart-line"></i> Status
                    </a>
                </li>
            </ul>
        </nav>

        <aside class="sidebar">
            <div class="control-panel">
                <h2>Controles</h2>
                <button onclick="controlCoffee('ligar')" class="control-button power-on">
                    <i class="fas fa-power-off"></i> Ligar Cafeteira
                </button>
                <button onclick="controlCoffee('desligar')" class="control-button power-off">
                    <i class="fas fa-power-off"></i> Desligar Cafeteira
                </button>
            </div>

            <div class="status-panel">
                <div class="status-item">
                    <span class="status-indicator" id="system-status"></span>
                    <span id="system-status-text">Sistema: --</span>
                </div>
                <div class="status-item">
                    <span class="status-indicator status-offline" id="coffee-status"></span>
                    <span id="coffee-status-text">Cafeteira: Desligada</span>
                    <div id="coffee-temperature"></div>
                    <div class="temperature-gauge">
                        <div class="temperature-fill" id="temperature-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="status-item">
                    <span id="lastActivity">Última Atividade: --:--</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="chat-container">
                <div class="messages" id="messages">
                    <div class="message bot-message">
                        Olá! Sou o assistente da sua cafeteira inteligente. Como posso ajudar?
                    </div>
                </div>
                <div class="input-container">
                    <input type="text" id="userInput" class="chat-input" placeholder="Digite sua mensagem...">
                    <button onclick="sendMessage()" id="sendButton" class="send-button">
                        <i class="fas fa-paper-plane"></i> Enviar
                    </button>
                </div>
            </div>
          </main>
        </div>
    
        <script>
            let statusUpdateInterval;
            let isProcessing = false;
            let conversationId = null;
    
            // Funções de status
            function updateStatus() {
                fetch('/status')
                    .then(response => response.json())
                    .then(data => {
                        // Atualiza status do sistema
                        const systemStatusIndicator = document.getElementById('system-status');
                        const systemStatusText = document.getElementById('system-status-text');
                        systemStatusIndicator.className = `status-indicator status-${data.status === "ligada" ? "online" : "offline"}`;
                        systemStatusText.textContent = `Sistema: ${data.status === "ligada" ? "Online" : "Offline"}`;
    
                        // Atualiza status da cafeteira
                        const coffeeStatusIndicator = document.getElementById('coffee-status');
                        const coffeeStatusText = document.getElementById('coffee-status-text');
                        const tempElement = document.getElementById('coffee-temperature');
                        const tempBar = document.getElementById('temperature-bar');
                        const lastActivity = document.getElementById('lastActivity');
    
                        coffeeStatusIndicator.className = `status-indicator status-${data.status === "ligada" ? "online" : "offline"}`;
                        coffeeStatusText.textContent = `Cafeteira: ${data.status.charAt(0).toUpperCase() + data.status.slice(1)}`;
    
                        if (data.temperature) {
                            const temp = parseFloat(data.temperature);
                            tempElement.textContent = `Temperatura: ${temp.toFixed(1)}°C`;
                            tempBar.style.width = `${Math.min(temp, 100)}%`;
                        }
    
                        if (data.last_activity) {
                            lastActivity.textContent = `Última Atividade: ${data.last_activity}`;
                        }
                    })
                    .catch(error => {
                        console.error('Erro ao atualizar status:', error);
                    });
            }
    
            // Funções de controle
            async function controlCoffee(action) {
                const message = `${action} cafeteira`;
                document.getElementById('userInput').value = message;
                await sendMessage();
            }
    
            // Funções de chat
            async function sendMessage() {
                if (isProcessing) return;
    
                const input = document.getElementById('userInput');
                const sendButton = document.getElementById('sendButton');
                const message = input.value.trim();
    
                if (!message) return;
    
                isProcessing = true;
                sendButton.disabled = true;
                sendButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    
                appendMessage(message, 'user-message');
                input.value = '';
    
                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            conversation_id: conversationId,
                            message: message,
                        }),
                    });
    
                    const data = await response.json();
    
                    if (data && data.answer) {
                        appendMessage(data.answer, 'bot-message');
                        if (data.conversation_id) {
                            conversationId = data.conversation_id;
                        }
                        updateStatus();
                    }
                } catch (error) {
                    console.error('Erro:', error);
                    appendMessage('Desculpe, ocorreu um erro ao processar sua mensagem.', 'bot-message');
                } finally {
                    isProcessing = false;
                    sendButton.disabled = false;
                    sendButton.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar';
                    input.focus();
                }
            }
    
            function appendMessage(content, className) {
                const messagesContainer = document.getElementById('messages');
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${className}`;
                messageDiv.textContent = content;
                messagesContainer.appendChild(messageDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
    
            // Função de logout
            async function handleLogout() {
                try {
                    await fetch('/logout');
                    window.location.href = '/auth';
                } catch (error) {
                    console.error('Erro ao fazer logout:', error);
                }
            }
    
            // Event Listeners
            document.addEventListener('DOMContentLoaded', function() {
                // Inicia atualização de status
                updateStatus();
                statusUpdateInterval = setInterval(updateStatus, 2000);
    
                // Enter para enviar mensagem
                document.getElementById('userInput').addEventListener('keypress', function(e) {
                    if (e.key === 'Enter' && !isProcessing) {
                        sendMessage();
                    }
                });
            });
    
            // Limpa intervalo quando a página é fechada
            window.addEventListener('beforeunload', function() {
                if (statusUpdateInterval) {
                    clearInterval(statusUpdateInterval);
                }
            });
        </script>
    </body>
    </html>
